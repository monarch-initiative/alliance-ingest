name: Release

on:
  schedule:
    # Run monthly on the 1st at midnight UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty for auto-generated date tag)'
        required: false
        type: string

env:
  TRANSFORMS: "gene disease phenotype expression genotype allele"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run pipeline
        run: just run

      - name: Generate release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            Automated monthly release of Alliance ingest data.

            ## Transforms included
            - gene (Gene entities)
            - disease (Disease associations)
            - phenotype (Phenotype associations)
            - expression (Expression data)
            - genotype (Genotype/AGM entities)
            - allele (Allele/variant entities)
          draft: false
          prerelease: false
          files: |
            output/*_nodes.tsv
            output/*_edges.tsv
