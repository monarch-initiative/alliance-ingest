### This file is a YAML configuration that specifies
### the data to be downloaded and ingested for this project.
### The configuration is used by `kghub-downloader`.
### For more information, see https://github.com/monarch-initiative/kghub-downloader
---
# Disease Association Data
- url: https://fms.alliancegenome.org/download/DISEASE-ALLIANCE_COMBINED.tsv.gz
  local_name: data/DISEASE-ALLIANCE_COMBINED.tsv.gz

# Phenotype Data
- url: https://fms.alliancegenome.org/download/PHENOTYPE_RGD.json.gz
  local_name: data/PHENOTYPE_RGD.json.gz
- url: https://fms.alliancegenome.org/download/PHENOTYPE_MGI.json.gz
  local_name: data/PHENOTYPE_MGI.json.gz
- url: https://fms.alliancegenome.org/download/PHENOTYPE_WB.json.gz
  local_name: data/PHENOTYPE_WB.json.gz
- url: https://fms.alliancegenome.org/download/PHENOTYPE_FB.json.gz
  local_name: data/PHENOTYPE_FB.json.gz
- url: https://fms.alliancegenome.org/download/PHENOTYPE_SGD.json.gz
  local_name: data/PHENOTYPE_SGD.json.gz

# uphenotizer binding table: maps each FlyBase/SGD annotation shape
# (source, ordered phenotype terms, ChEBI condition) to the pre-composed
# DPO-ext / APO-ext phenotype class (PHENOTYPE:*) that phenio imports.
# See https://github.com/monarch-initiative/uphenotizer#binding-annotations-to-classes
- url: https://raw.githubusercontent.com/monarch-initiative/uphenotizer/main/output/source_map.tsv
  local_name: data/uphenotizer_source_map.tsv

# FBcv: namespaces decide which trailing terms of a FlyBase annotation are
# droppable context when the head term is already a DPO class
- url: http://purl.obolibrary.org/obo/fbcv.obo
  local_name: data/fbcv.obo

